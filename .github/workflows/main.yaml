name: Build Auralux APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project & Inject Code
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.sargis.auralux --project-name auralux_constellations /tmp/auralux_app
          rm -rf /tmp/auralux_app/test
          sed 's/ft\.height/tp.height/g' /tmp/main.dart > /tmp/auralux_app/lib/main.dart
          cd /tmp/auralux_app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        working-directory: /tmp/auralux_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralux-Constellations-APK
          path: /tmp/auralux_app/build/app/outputs/flutter-apk/app-release.apk
